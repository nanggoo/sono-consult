<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리조트 상담 안내</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #eef4fb;
      color: #10233f;
    }

    .wrap {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }

    .hero {
      position: relative;
      height: 58vh;
      padding: 42px 24px;
      text-align: center;
      color: #ffffff;
      background:
        linear-gradient(rgba(10,35,70,0.25), rgba(10,35,70,0.15)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80");
      background-size: cover;
      background-position: center;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      margin-bottom: 60px;
      font-weight: 600;
    }

    .hero h1 {
      font-size: 30px;
      line-height: 1.4;
      margin-bottom: 18px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.25);
    }

    .hero p {
      font-size: 16px;
      opacity: 0.95;
    }

    .card {
      position: relative;
      margin-top: -55px;
      padding: 34px 22px 36px;
      background: #ffffff;
      border-radius: 32px 32px 0 0;
    }

    .card h2 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 28px;
      color: #10233f;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 20px;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-main {
      background: linear-gradient(135deg, #082b5f, #0f4a8a);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(8,43,95,0.25);
    }

    .btn-sub {
      background: #ffffff;
      color: #10233f;
      border: 1px solid #d9e3f2;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .btn-main .icon {
      background: rgba(255,255,255,0.15);
    }

    .btn-sub .icon {
      background: #eef4fb;
    }

    .text {
      flex: 1;
    }

    .text strong {
      display: block;
      font-size: 21px;
      margin-bottom: 7px;
    }

    .text span {
      display: block;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.8;
    }

    .arrow {
      font-size: 32px;
      margin-left: 12px;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #7b8794;
      padding-top: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section class="hero">
      <div class="logo">SONO RESORT</div>

      <h1>
        프리미엄 휴식의 가치,<br />
        리조트 회원권 안내
      </h1>

      <p>자연과 품격이 함께하는 특별한 공간</p>
    </section>

    <section class="card">
      <h2>원하시는 정보를 선택해주세요</h2>

      <a class="btn btn-main" href="https://open.kakao.com/o/상담링크" target="_blank">
        <div class="icon">🎧</div>
        <div class="text">
          <strong>모바일로 바로 상담하기</strong>
          <span>전문 상담사와 실시간 상담을 시작하세요.</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="btn btn-sub" href="https://k-114.github.io/resort/status.html" target="_blank">
        <div class="icon">🏨</div>
        <div class="text">
          <strong>리조트 현황 보기</strong>
          <span>리조트 정보와 분양 현황을 확인하세요.</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <div class="footer">
        강낭구 LC · 소노호텔앤리조트
      </div>
    </section>

  </div>
</body>
</html>
